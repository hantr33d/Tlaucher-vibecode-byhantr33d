name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Устанавливаем Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Сборка
        run: gradle build --no-daemon

      - name: Публикуем артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ClientMod-Package
          path: |
            build/libs/*.jar
            ClientLauncher.exe
          if-no-files-found: warn
