name: build
on: [push, workflow_dispatch]
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 5.6.4
          arguments: build
      - uses: actions/upload-artifact@v4
        with:
          name: clientmod-jar
          path: build/libs/*.jar
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name ClientLauncher launcher/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-exe
          path: dist/ClientLauncher.exe
  package:
    needs: [mod, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: |
          mkdir out
          cp parts/clientmod-jar/*.jar out/
          cp parts/launcher-exe/*.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: ClientMod-Package
          path: out
